workflows:
  ios-workflow:
    name: iOS Build (.ipa)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      xcode: latest
      cocoapods: default
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Build Web assets and sync Capacitor
        script: |
          npm run build
      - name: Install CocoaPods
        script: |
          cd ios/App && pod install
      - name: Build iOS Application (.ipa)
        script: |
          cd ios/App
          if [ -n "$CM_CERTIFICATE" ]; then
            xcode-project build-ipa --workspace App.xcworkspace --scheme App
          else
            echo "Building unsigned IPA for testing & sideloading..."
            xcodebuild -workspace App.xcworkspace \
              -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath build/App.xcarchive \
              archive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""
            
            mkdir -p build/Payload
            cp -r build/App.xcarchive/Products/Applications/App.app build/Payload/
            cd build
            zip -r Noor-e-Namaz.ipa Payload
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ios/App/build/*.ipa
      - ios/App/build/App.xcarchive
      - /tmp/xcodebuild_logs/*.log

  android-workflow:
    name: Android Build (.apk)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      node: 20
      java: 17
    scripts:
      - name: Install Node dependencies
        script: |
          npm install
      - name: Build Web assets and sync Capacitor
        script: |
          npm run build
      - name: Build Android APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/**/*.apk
